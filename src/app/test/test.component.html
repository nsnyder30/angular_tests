<div class="calendar-container" [@viewTransition]="view">
	<div class="row" *ngFor="let row of [0, 1, 2, 3]">
		<div [@monthTransition]="selectedMonth == row * 4 + col ? 'expanded' : 'collapsed'" class="col month-cell border border-secondary" *ngFor="let col of [0, 1, 2]" (click)="selectMonth(row * 4 + col)">
			{{row * 4 + col}}
		</div>
	</div>
</div>
